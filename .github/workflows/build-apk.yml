name: Android APK Olustur

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Bagimliliklari yukle
        run: npm install

      - name: Android platformunu ekle ve senkronize et
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Debug APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK dosyasini yayinla
        uses: actions/upload-artifact@v4
        with:
          name: Sulzer-16ZAV40S-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
